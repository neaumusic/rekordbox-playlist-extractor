[project]
name = "rbx"
version = "0.1.0"
description = "Rekordbox library CLI: playlist extraction, hot-cue stripping, DateAdded sorting, folder import."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "James Wilson", email = "jsw.james.wilson@gmail.com" }
]
dependencies = [
    "pyrekordbox>=0.4.4",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=7.2.2",
]

[project.scripts]
rbx = "rbx.cli:app"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
